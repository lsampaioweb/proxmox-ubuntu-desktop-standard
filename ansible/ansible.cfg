[defaults]
# Inform Ansible to use this specific file as the inventory.
inventory = inventory/hosts

# Inform Ansible to output some information about the playbook execution.
callbacks_enabled = timer, profile_roles

# Inform Ansible to use this version as default.
interpreter_python = /usr/bin/python3

# Number of parallel processes to run during plays.
forks = 5

# Disable creation of retry files for idempotent re-execution validation.
retry_files_enabled = false

# Gather facts using SSH-optimized smart gathering.
gathering = smart

# Set SSH connection timeout in seconds.
timeout = 30

[ssh_connection]
# Reduce the number of SSH connections.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Enable SSH pipelining for improved performance when privilege escalation is not required.
pipelining = true
